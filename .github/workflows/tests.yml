name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # GitHub did not hand out a macOS runner for this repo (3 tries, "job was not acquired").
    # Until it does, a missing macOS run must not turn the whole check red. Re-check this in M2.
    continue-on-error: ${{ startsWith(matrix.os, 'macos') }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: Tests
        run: uv run pytest
      - name: Self-test
        run: uv run layerforge selftest
